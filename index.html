<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AutoDeploy UI</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
    pre { background: #f4f4f4; padding: 10px; }
  </style>
</head>
<body>

<h2>🚀 AutoDeploy Backend Test</h2>

<button onclick="checkHealth()">Check Health</button>
<button onclick="checkStatus()">Check Status</button>

<pre id="output">Click a button...</pre>

<script>
const API = "https://lustrelessly-conglutinative-jennefer.ngrok-free.app";

async function safeFetch(url, options = {}) {
  try {
    const res = await fetch(url, {
      ...options,
      headers: {
        "ngrok-skip-browser-warning": "true"
      }
    });

    const text = await res.text();

    try {
      return JSON.parse(text);
    } catch {
      return { raw: text };
    }

  } catch (err) {
    return { error: err.message };
  }
}

async function checkHealth() {
  const output = document.getElementById("output");
  output.textContent = "Loading...";

  const data = await safeFetch(`${API}/health`);
  output.textContent = JSON.stringify(data, null, 2);
}

async function checkStatus() {
  const output = document.getElementById("output");
  output.textContent = "Loading...";

  const data = await safeFetch(`${API}/status`);
  output.textContent = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>

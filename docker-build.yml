name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      # ── Build & push to Docker Hub ──────────────────────────────────────────
      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔨 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/YOUR_APP_NAME:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/YOUR_APP_NAME:${{ github.sha }}

      # ── Deploy to Azure Container Apps ──────────────────────────────────────
      - name: ☁️ Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 📦 Install containerapp CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: 🚀 Deploy to Azure Container Apps
        run: |
          # Try update first, create if not exists
          az containerapp update \
            --name YOUR_APP_NAME \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/YOUR_APP_NAME:${{ github.sha }} \
          || az containerapp create \
            --name YOUR_APP_NAME \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --environment ${{ secrets.ACA_ENVIRONMENT }} \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/YOUR_APP_NAME:${{ github.sha }} \
            --target-port 8080 \
            --ingress external \
            --min-replicas 0 \
            --max-replicas 3

      - name: 🔗 Get app URL
        run: |
          az containerapp show \
            --name YOUR_APP_NAME \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv

name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/autodeploy-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/autodeploy-backend:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      - name: Delete old backend if exists
        run: |
          EXISTS=$(az containerapp show \
            --name autodeploy-backend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "name" -o tsv 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "Deleting old backend..."
            az containerapp delete \
              --name autodeploy-backend \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --yes
            for i in $(seq 1 20); do
              STILL=$(az containerapp show \
                --name autodeploy-backend \
                --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                --query "name" -o tsv 2>/dev/null || echo "")
              if [ -z "$STILL" ]; then
                echo "Deleted after $i checks"
                break
              fi
              echo "Waiting... $i/20"
              sleep 10
            done
          fi

      - name: Create backend with secrets
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          AZURE_RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ACA_ENV: ${{ secrets.ACA_ENVIRONMENT }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURESUN_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURESUN_AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURESUN_AZURE_TENANT_ID }}
          AZURE_SUB_ID: ${{ secrets.AZURESUN_AZURE_SUBSCRIPTION_ID }}
        run: |
          az containerapp create \
            --name autodeploy-backend \
            --resource-group "$AZURE_RG" \
            --environment "$ACA_ENV" \
            --image "$DH_USERNAME/autodeploy-backend:${{ github.sha }}" \
            --target-port 8080 \
            --ingress external \
            --min-replicas 1 \
            --max-replicas 3 \
            --cpu 0.5 --memory 1.0Gi \
            --env-vars \
              "GEMINI_KEY=$GEMINI_KEY" \
              "DH_USERNAME=$DH_USERNAME" \
              "DH_TOKEN=$DH_TOKEN" \
              "AZURE_RG=$AZURE_RG" \
              "ACA_ENV=$ACA_ENV" \
              "ACR_NAME=$ACR_NAME" \
              "AZURE_CLIENT_ID=$AZURE_CLIENT_ID" \
              "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET" \
              "AZURE_TENANT_ID=$AZURE_TENANT_ID" \
              "AZURE_SUB_ID=$AZURE_SUB_ID"

      - name: Print backend URL
        run: |
          URL=$(az containerapp show \
            --name autodeploy-backend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "======================================"
          echo "✅ Backend URL: https://$URL"
          echo "======================================"

name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/autodeploy-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/autodeploy-backend:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      - name: Delete old backend if exists
        run: |
          EXISTS=$(az containerapp show \
            --name autodeploy-backend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "name" -o tsv 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "Deleting old backend..."
            az containerapp delete \
              --name autodeploy-backend \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --yes
            sleep 15
          fi

      - name: Create fresh backend
        run: |
          az containerapp create \
            --name autodeploy-backend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --environment ${{ secrets.ACA_ENVIRONMENT }} \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/autodeploy-backend:${{ github.sha }} \
            --target-port 8080 \
            --ingress external \
            --min-replicas 1 \
            --max-replicas 3 \
            --cpu 0.5 --memory 1.0Gi \
            --env-vars \
              "GEMINI_KEY=${{ secrets.GEMINI_KEY }}" \
              "DH_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" \
              "DH_TOKEN=${{ secrets.DOCKERHUB_TOKEN }}" \
              "AZURE_RG=${{ secrets.AZURE_RESOURCE_GROUP }}" \
              "ACA_ENV=${{ secrets.ACA_ENVIRONMENT }}" \
              "ACR_NAME=${{ secrets.ACR_NAME }}" \
            2>&1
          echo "Exit code: $?"

      - name: Print backend URL
        run: |
          URL=$(az containerapp show \
            --name autodeploy-backend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "======================================"
          echo "✅ Backend URL: https://$URL"
          echo "======================================"

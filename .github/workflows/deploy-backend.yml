name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/autodeploy-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/autodeploy-backend:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      - name: Create backend if not exists
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/autodeploy-backend:${{ github.sha }}
        run: |
          EXISTS=$(az containerapp show \
            --name autodeploy-backend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "name" -o tsv 2>/dev/null || echo "")

          if [ -z "$EXISTS" ]; then
            echo "First time — creating container app..."
            az containerapp create \
              --name autodeploy-backend \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --environment ${{ secrets.ACA_ENVIRONMENT }} \
              --image "$IMAGE" \
              --target-port 8080 \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 3 \
              --cpu 0.5 --memory 1.0Gi
            echo "✅ Created"
          else
            echo "Already exists — skipping create"
          fi

      - name: Set secrets on container app
        run: |
          az containerapp secret set \
            --name autodeploy-backend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --secrets \
              gemini-key="${{ secrets.GEMINI_KEY }}" \
              dh-username="${{ secrets.DOCKERHUB_USERNAME }}" \
              dh-token="${{ secrets.DOCKERHUB_TOKEN }}" \
              azure-rg="${{ secrets.AZURE_RESOURCE_GROUP }}" \
              aca-env="${{ secrets.ACA_ENVIRONMENT }}" \
              acr-name="${{ secrets.ACR_NAME }}" \
              azure-client-id="${{ secrets.AZURESUN_AZURE_CLIENT_ID }}" \
              azure-client-secret="${{ secrets.AZURESUN_AZURE_CLIENT_SECRET }}" \
              azure-tenant-id="${{ secrets.AZURESUN_AZURE_TENANT_ID }}" \
              azure-sub-id="${{ secrets.AZURESUN_AZURE_SUBSCRIPTION_ID }}"

      - name: Wire secrets to env vars
        run: |
          az containerapp update \
            --name autodeploy-backend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --set-env-vars \
              GEMINI_KEY=secretref:gemini-key \
              DH_USERNAME=secretref:dh-username \
              DH_TOKEN=secretref:dh-token \
              AZURE_RG=secretref:azure-rg \
              ACA_ENV=secretref:aca-env \
              ACR_NAME=secretref:acr-name \
              AZURE_CLIENT_ID=secretref:azure-client-id \
              AZURE_CLIENT_SECRET=secretref:azure-client-secret \
              AZURE_TENANT_ID=secretref:azure-tenant-id \
              AZURE_SUB_ID=secretref:azure-sub-id

      - name: Update image only
        run: |
          az containerapp update \
            --name autodeploy-backend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/autodeploy-backend:${{ github.sha }}

      - name: Print backend URL
        run: |
          URL=$(az containerapp show \
            --name autodeploy-backend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "======================================"
          echo "✅ Backend URL: https://$URL"
          echo "======================================"

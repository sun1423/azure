name: Deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Link check (monthly or manual runs only)
        if: github.event_name != 'push'
        run: |
          node scripts/check.mjs
          git config user.name "link-check-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/status.json
          git commit -m "Monthly link check" || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: d
        uses: actions/deploy-pages@v4

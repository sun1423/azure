name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Inject all secrets into index.html
        env:
          GEMINI_KEY:   ${{ secrets.GEMINI_KEY }}
          GH_PAT:       ${{ secrets.GH_PAT }}
          GH_USERNAME:  ${{ secrets.GH_USERNAME }}
          GH_REPO:      ${{ secrets.GH_REPO }}
          DH_USERNAME:  ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN:     ${{ secrets.DOCKERHUB_TOKEN }}
          AZURE_RG:     ${{ secrets.AZURE_RESOURCE_GROUP }}
          ACA_ENV:      ${{ secrets.ACA_ENVIRONMENT }}
        run: |
          sed -i "s|%%GEMINI_KEY%%|${GEMINI_KEY}|g"    index.html
          sed -i "s|%%GH_PAT%%|${GH_PAT}|g"            index.html
          sed -i "s|%%GH_USERNAME%%|${GH_USERNAME}|g"   index.html
          sed -i "s|%%GH_REPO%%|${GH_REPO}|g"           index.html
          sed -i "s|%%DH_USERNAME%%|${DH_USERNAME}|g"   index.html
          sed -i "s|%%DH_TOKEN%%|${DH_TOKEN}|g"         index.html
          sed -i "s|%%AZURE_RG%%|${AZURE_RG}|g"         index.html
          sed -i "s|%%ACA_ENV%%|${ACA_ENV}|g"           index.html
          echo "✅ All secrets injected"

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

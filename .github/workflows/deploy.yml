name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets
        run: |
          sed -i "s|%%GEMINI_KEY%%|${{ secrets.GEMINI_KEY }}|g"               index.html
          sed -i "s|%%GH_PAT%%|${{ secrets.GH_PAT }}|g"                       index.html
          sed -i "s|%%GH_USERNAME%%|${{ secrets.GH_USERNAME }}|g"             index.html
          sed -i "s|%%GH_REPO%%|${{ secrets.GH_REPO }}|g"                     index.html
          sed -i "s|%%DH_USERNAME%%|${{ secrets.DOCKERHUB_USERNAME }}|g"      index.html
          sed -i "s|%%DH_TOKEN%%|${{ secrets.DOCKERHUB_TOKEN }}|g"            index.html
          sed -i "s|%%AZURE_RG%%|${{ secrets.AZURE_RESOURCE_GROUP }}|g"       index.html
          sed -i "s|%%ACA_ENV%%|${{ secrets.ACA_ENVIRONMENT }}|g"             index.html
          echo "Done injecting"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

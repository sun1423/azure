<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local News Hub</title>
<meta name="description" content="Local newspapers, TV and digital news sites selected automatically for your country.">
<meta name="theme-color" content="#0f3d2e">
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#14201a;--mute:#5d6b63;--line:#dfe5df;--accent:#0f3d2e;--chip:#e5ece6;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#18201b;--ink:#e9efe9;--mute:#98a79d;--line:#27322b;--accent:#7fd1a8;--chip:#223028}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Malayalam","Noto Sans Gujarati","Noto Sans Gurmukhi","Noto Sans Oriya","Noto Naskh Arabic",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{text-align:center;background:var(--accent);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px}
@media (prefers-color-scheme:dark){header{color:#0b1a13}}
h1{margin:0 0 4px;font-size:1.35rem;line-height:1.2}
header p{margin:0;font-size:.9rem;opacity:.85}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:grid;gap:8px}
select,input{width:100%;font:inherit;padding:13px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
select:focus,input:focus,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.country-picker{position:relative}
.country-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.14)}
.country-menu[hidden]{display:none}
.country-option{display:block;width:100%;text-align:left;font:inherit;padding:11px 12px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.country-option:last-child{border-bottom:0}
.country-option:hover,.country-option:focus{background:var(--chip)}
.country-none{padding:12px;color:var(--mute);font-size:.9rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;overflow-x:auto}
.chips button{flex:none;font:inherit;font-size:.85rem;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme:dark){.chips button[aria-pressed=true]{color:#0b1a13}}
.count{color:var(--mute);font-size:.85rem;margin:4px 2px 8px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit;text-decoration:none}
li a:active{background:var(--chip)}
.n{font-weight:600}
.h{display:block;color:var(--mute);font-size:.8rem;margin-top:2px;word-break:break-all}
.t{flex:none;font-size:.72rem;padding:3px 8px;border-radius:99px;background:var(--chip);color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
footer{color:var(--mute);font-size:.78rem;text-align:center;padding:0 14px 24px}
</style>
</head>
<body>
<header>
  <h1 id="title">Local News</h1>
  <p id="subtitle">Finding news sources for your country…</p>
</header>
<main>
  <div class="controls">
    <div class="row">
      <div class="country-picker">
        <input id="countrySearch" type="search" placeholder="Detecting country…" aria-label="Search and select country" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="countryMenu">
        <div id="countryMenu" class="country-menu" role="listbox" hidden></div>
        <input id="country" type="hidden" value="">
      </div>
      <select id="lang" aria-label="Select language"><option value="">Select language</option></select>
    </div>
    <input id="q" type="search" placeholder="Search outlets" aria-label="Search outlets" hidden>
    <div class="chips" id="chips" hidden>
      <button data-t="" aria-pressed="true">All</button>
      <button data-t="p" aria-pressed="false">Newspaper</button>
      <button data-t="t" aria-pressed="false">TV</button>
      <button data-t="d" aria-pressed="false">Digital</button>
    </div>
  </div>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
  <div class="empty" id="empty">Detecting your country…</div>
</main>
<footer id="foot"></footer>
<script src="outlets.js"></script>
<script>
const TL={p:"Newspaper",t:"TV",d:"Digital"};
const $=id=>document.getElementById(id);
let ROOT={},DATA=[],FAILS={},type="";
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch{return u}};
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const displayCountry=code=>{try{return new Intl.DisplayNames([navigator.language||"en"],{type:"region"}).of(code)||code}catch{return code}};

function setHeader(country){
  const name=country?.name||"Local";
  document.title=name+" News";
  $("title").textContent=name+" News";
  $("subtitle").textContent=country?.languages?.length>1
    ? "Choose a language. Open a local newspaper, TV or digital news site."
    : "Local newspaper, TV and digital news sources selected for "+name+".";
}

function fillLanguages(country,preferred=""){
  const sel=$("lang");sel.innerHTML='<option value="">Select language</option>';
  DATA=country?.languages||[];
  for(const l of DATA){
    const op=document.createElement("option");op.value=l.code;
    op.textContent=l.name+(l.native&&l.native!==l.name?" – "+l.native:"");sel.append(op);
  }
  const wanted=preferred||store.get("lang:"+$("country").value);
  if(wanted&&DATA.some(l=>l.code===wanted))sel.value=wanted;
  else if(DATA.length===1)sel.value=DATA[0].code;
  else if($("country").value==="IN"&&DATA.some(l=>l.code==="hi"))sel.value="hi";
}

function render(){
  const code=$("lang").value,list=$("list");
  list.innerHTML="";
  $("q").hidden=$("chips").hidden=!code;
  if(!code){$("empty").hidden=false;$("empty").textContent="Choose a language above to see its news outlets.";$("count").textContent="";return}
  const L=DATA.find(l=>l.code===code);
  if(!L){$("empty").hidden=false;$("empty").textContent="No news sources configured for this language.";return}
  const q=$("q").value.trim().toLowerCase();
  const items=L.outlets.filter(o=>(FAILS[o[1]]||0)<2&&(!type||o[2]===type)&&(!q||o[0].toLowerCase().includes(q)||o[1].toLowerCase().includes(q)));
  $("count").textContent=items.length+" outlets · "+L.name;
  $("empty").hidden=items.length>0;
  $("empty").textContent="No outlets match.";
  const frag=document.createDocumentFragment();
  for(const [name,url,t] of items){
    const li=document.createElement("li"),a=document.createElement("a");
    a.href=url;a.target="_blank";a.rel="noopener noreferrer";
    const d=document.createElement("div"),n=document.createElement("span"),h=document.createElement("span"),b=document.createElement("span");
    n.className="n";n.textContent=name;h.className="h";h.textContent=host(url);
    b.className="t";b.textContent=TL[t]||"";
    d.append(n,h);a.append(d,b);li.append(a);frag.append(li);
  }
  list.append(frag);
}

function selectCountry(code,preferredLang="",remember=false){
  code=(code||"").toUpperCase();
  const country=ROOT.countries?.[code];
  if(!country){
    const fallback=ROOT.defaultCountry||"IN";
    $("country").value=fallback;
    const fb=ROOT.countries?.[fallback];
    $("countrySearch").value=fb?.name||fallback;
    setHeader(fb);fillLanguages(fb,preferredLang);render();
    $("empty").hidden=false;
    $("empty").textContent="News sources for "+displayCountry(code)+" are not configured yet. Showing "+fb.name+" instead.";
    return;
  }
  $("country").value=code;
  $("countrySearch").value=country.name;
  closeCountryMenu();
  setHeader(country);fillLanguages(country,preferredLang);$("q").value="";type="";
  [...$("chips").children].forEach((c,i)=>c.setAttribute("aria-pressed",i===0));
  render();
}

function countryEntries(){
  return Object.entries(ROOT.countries||{}).sort((a,b)=>a[1].name.localeCompare(b[1].name));
}
function closeCountryMenu(){
  $("countryMenu").hidden=true;
  $("countrySearch").setAttribute("aria-expanded","false");
}
function showCountryMenu(query=""){
  const menu=$("countryMenu"),q=query.trim().toLowerCase();
  menu.innerHTML="";
  const matches=countryEntries().filter(([code,c])=>!q||c.name.toLowerCase().includes(q)||code.toLowerCase().startsWith(q));
  if(!matches.length){
    const d=document.createElement("div");d.className="country-none";d.textContent="No matching country";menu.append(d);
  }else{
    const frag=document.createDocumentFragment();
    for(const [code,c] of matches){
      const b=document.createElement("button");b.type="button";b.className="country-option";b.dataset.code=code;b.setAttribute("role","option");b.textContent=c.name;frag.append(b);
    }
    menu.append(frag);
  }
  menu.hidden=false;$("countrySearch").setAttribute("aria-expanded","true");
}

function localeCountry(){
  const langs=[...(navigator.languages||[]),navigator.language].filter(Boolean);
  for(const tag of langs){
    try{const region=new Intl.Locale(tag).region;if(region)return region.toUpperCase()}catch{}
    const m=String(tag).match(/[-_]([A-Za-z]{2})$/);if(m)return m[1].toUpperCase();
  }
  return "";
}

async function detectCountry(){
  try{
    const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),3500);
    const r=await fetch("https://ipapi.co/country/",{signal:ctrl.signal,cache:"no-store"});
    clearTimeout(timer);
    if(r.ok){const code=(await r.text()).trim().toUpperCase();if(/^[A-Z]{2}$/.test(code))return code}
  }catch{}
  return localeCountry()||ROOT.defaultCountry||"IN";
}

function parseHash(){
  const raw=location.hash.slice(1);
  if(!raw)return {};
  const [country,lang]=raw.split("/");
  return {country:(country||"").toUpperCase(),lang:lang||""};
}
function syncHash(){
  const c=$("country").value,l=$("lang").value;
  history.replaceState(null,"",c?("#"+c+(l?"/"+l:"")):location.pathname);
}

async function init(){
  try{
    ROOT=window.OUTLETS||{};
    const s=await fetch("status.json").then(r=>r.json()).catch(()=>({}));
    FAILS=s.fails||{};
    if(s.updated)$("foot").textContent="Links last checked "+new Date(s.updated).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
    const hash=parseHash();
    const start=await detectCountry();
    const preferredLang=hash.country===start?hash.lang:"";
    selectCountry(start,preferredLang,false);syncHash();
  }catch(e){$("empty").textContent="Could not load outlets. Check your connection and reload."}
}

$("countrySearch").addEventListener("focus",e=>{e.target.select();showCountryMenu("")});
$("countrySearch").addEventListener("click",e=>{e.target.select();showCountryMenu("")});
$("countrySearch").addEventListener("input",e=>showCountryMenu(e.target.value));
$("countrySearch").addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeCountryMenu();e.target.value=ROOT.countries?.[$("country").value]?.name||""}
  if(e.key==="Enter"){
    const first=$("countryMenu").querySelector(".country-option");
    if(first){e.preventDefault();selectCountry(first.dataset.code,"",false);syncHash()}
  }
});
$("countryMenu").addEventListener("click",e=>{const b=e.target.closest(".country-option");if(!b)return;selectCountry(b.dataset.code,"",false);syncHash()});
document.addEventListener("click",e=>{if(!e.target.closest(".country-picker"))closeCountryMenu()});
$("lang").addEventListener("change",e=>{store.set("lang:"+$("country").value,e.target.value);$("q").value="";render();syncHash()});
$("q").addEventListener("input",render);
$("chips").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;type=b.dataset.t;[...$("chips").children].forEach(c=>c.setAttribute("aria-pressed",c===b));render()});
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Language Indian Newspapers</title>
<meta name="description" content="Indian newspapers, TV and digital news sites in every language, in one place.">
<meta name="theme-color" content="#0f3d2e">
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#14201a;--mute:#5d6b63;--line:#dfe5df;--accent:#0f3d2e;--chip:#e5ece6;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#18201b;--ink:#e9efe9;--mute:#98a79d;--line:#27322b;--accent:#7fd1a8;--chip:#223028}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Malayalam","Noto Sans Gujarati","Noto Sans Gurmukhi","Noto Sans Oriya","Noto Naskh Arabic",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{text-align:center;background:var(--accent);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px}
@media (prefers-color-scheme:dark){header{color:#0b1a13}}
h1{margin:0 0 4px;font-size:1.35rem;line-height:1.2}
header p{margin:0;font-size:.9rem;opacity:.85}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:grid;gap:8px}
select,input{width:100%;font:inherit;padding:13px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
select:focus,input:focus,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto}
.chips button{flex:none;font:inherit;font-size:.85rem;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme:dark){.chips button[aria-pressed=true]{color:#0b1a13}}
.count{color:var(--mute);font-size:.85rem;margin:4px 2px 8px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit;text-decoration:none}
li a:active{background:var(--chip)}
.n{font-weight:600}
.h{display:block;color:var(--mute);font-size:.8rem;margin-top:2px;word-break:break-all}
.t{flex:none;font-size:.72rem;padding:3px 8px;border-radius:99px;background:var(--chip);color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
footer{color:var(--mute);font-size:.78rem;text-align:center;padding:0 14px 24px}
</style>
</head>
<body>
<header>
  <h1>All Language Indian Newspapers</h1>
  <p>Pick a language. Open any newspaper, TV or digital news site.</p>
</header>
<main>
  <div class="controls">
    <select id="lang" aria-label="Select language"><option value="">Select language</option></select>
    <input id="q" type="search" placeholder="Search outlets" aria-label="Search outlets" hidden>
    <div class="chips" id="chips" hidden>
      <button data-t="" aria-pressed="true">All</button>
      <button data-t="p" aria-pressed="false">Newspaper</button>
      <button data-t="t" aria-pressed="false">TV</button>
      <button data-t="d" aria-pressed="false">Digital</button>
    </div>
  </div>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
  <div class="empty" id="empty">Choose a language above to see its news outlets.</div>
</main>
<footer id="foot"></footer>
<script src="outlets.js"></script>
<script>
const TL={p:"Newspaper",t:"TV",d:"Digital"};
const $=id=>document.getElementById(id);
let DATA=[],FAILS={},type="";
const host=u=>new URL(u).hostname.replace(/^www\./,"");
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};

function render(){
  const code=$("lang").value,list=$("list");
  list.innerHTML="";
  $("q").hidden=$("chips").hidden=!code;
  if(!code){$("empty").hidden=false;$("empty").textContent="Choose a language above to see its news outlets.";$("count").textContent="";return}
  const L=DATA.find(l=>l.code===code);
  const q=$("q").value.trim().toLowerCase();
  const items=L.outlets.filter(o=>(FAILS[o[1]]||0)<2&&(!type||o[2]===type)&&(!q||o[0].toLowerCase().includes(q)||o[1].includes(q)));
  $("count").textContent=items.length+" outlets · "+L.name;
  $("empty").hidden=items.length>0;
  $("empty").textContent="No outlets match.";
  const frag=document.createDocumentFragment();
  for(const [name,url,t] of items){
    const li=document.createElement("li"),a=document.createElement("a");
    a.href=url;a.target="_blank";a.rel="noopener noreferrer";
    const d=document.createElement("div"),n=document.createElement("span"),h=document.createElement("span"),b=document.createElement("span");
    n.className="n";n.textContent=name;h.className="h";h.textContent=host(url);
    b.className="t";b.textContent=TL[t]||"";
    d.append(n,h);a.append(d,b);li.append(a);frag.append(li);
  }
  list.append(frag);
}

async function init(){
  try{
    const o=window.OUTLETS;
    const s=await fetch("status.json").then(r=>r.json()).catch(()=>({}));
    DATA=o.languages;FAILS=s.fails||{};
    if(s.updated)$("foot").textContent="Links last checked "+new Date(s.updated).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
    const sel=$("lang");
    for(const l of DATA){const op=document.createElement("option");op.value=l.code;op.textContent=l.name+(l.native&&l.native!==l.name?" – "+l.native:"");sel.append(op)}
    const start=location.hash.slice(1)||store.get("lang");
    if(start&&DATA.some(l=>l.code===start))sel.value=start;
    render();
  }catch{$("empty").textContent="Could not load outlets. Check your connection and reload."}
}
$("lang").addEventListener("change",e=>{store.set("lang",e.target.value);history.replaceState(null,"",e.target.value?"#"+e.target.value:location.pathname);$("q").value="";render()});
$("q").addEventListener("input",render);
$("chips").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;type=b.dataset.t;[...$("chips").children].forEach(c=>c.setAttribute("aria-pressed",c===b));render()});
init();
</script>
</body>
</html>
